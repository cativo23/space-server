services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.2.1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - /mnt/hdd/uptime-kuma:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`uptime.cativo.dev`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.uptime.middlewares=security-headers@file"
      # status.cativo.dev → masks /status/public on uptime-kuma (URL stays as
      # status.cativo.dev in the browser). Only the root path is rewritten so
      # asset paths (/styles, /js, /api/...) pass through unchanged.
      - "traefik.http.routers.uptime-status.rule=Host(`status.cativo.dev`)"
      - "traefik.http.routers.uptime-status.entrypoints=websecure"
      - "traefik.http.routers.uptime-status.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.uptime-status.middlewares=status-rewrite,security-headers@file"
      - "traefik.http.middlewares.status-rewrite.replacepathregex.regex=^/$$"
      - "traefik.http.middlewares.status-rewrite.replacepathregex.replacement=/status/public"
    networks:
      - space-server_web

networks:
  space-server_web:
    external: true
