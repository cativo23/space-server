name: validate

on:
  push:
    branches: [main]
    paths:
      - "**/docker-compose.yml"
      - "prometheus/**"
      - "alertmanager/**"
      - "traefik/**"
      - "grafana/**"
      - ".github/workflows/validate.yml"
      - "scripts/docker-retention.sh"
      - "tests/**"
      - "systemd/**"
  pull_request:
    paths:
      - "**/docker-compose.yml"
      - "prometheus/**"
      - "alertmanager/**"
      - "traefik/**"
      - "grafana/**"
      - ".github/workflows/validate.yml"
      - "scripts/docker-retention.sh"
      - "tests/**"
      - "systemd/**"

jobs:
  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate root compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: validate mail-server compose
        env:
          MAIL_DOMAIN: example.com
          MAIL_ACCOUNTS: ci-dummy@example.com|dummy
          TRAEFIK_ACME_PATH: /tmp/acme.json
        run: docker compose -f mail-server/docker-compose.yml config --quiet

      - name: validate dozzle compose
        run: docker compose -f dozzle/docker-compose.yml config --quiet

      - name: validate uptime-kuma compose
        run: docker compose -f uptime-kuma/docker-compose.yml config --quiet

  prometheus:
    name: prometheus + alertmanager rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: prometheus config
        run: |
          docker run --rm -v "$PWD/prometheus":/etc/prometheus \
            --entrypoint promtool prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml

      - name: prometheus alert rules
        run: |
          docker run --rm -v "$PWD/prometheus":/etc/prometheus \
            --entrypoint promtool prom/prometheus:latest \
            check rules /etc/prometheus/alert_rules.yml

      - name: prometheus alert rule tests
        run: |
          docker run --rm -v "$PWD/prometheus":/etc/prometheus -w /etc/prometheus \
            --entrypoint promtool prom/prometheus:latest \
            test rules alert_rules_test.yml

      - name: alertmanager config
        run: |
          docker run --rm -v "$PWD/alertmanager":/etc/alertmanager \
            --entrypoint amtool prom/alertmanager:latest \
            check-config /etc/alertmanager/alertmanager.yml

  retention:
    name: docker-retention script + units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        # The .bats files are included: a `! grep` that can never fail is
        # exactly the kind of thing it flags.
        run: shellcheck -x scripts/docker-retention.sh tests/stub/docker tests/docker-retention.bats

      - name: bats
        # The suite calls bats_require_minimum_version, which exists from
        # bats-core 1.7.0. Distro packages can be older, so install a pinned
        # release instead of apt's.
        run: |
          git clone --quiet --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          # A tag can be moved; the commit it pointed at when it was reviewed cannot.
          test "$(git -C "$RUNNER_TEMP/bats-core" rev-parse HEAD)" = 3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
          bats --version
          bats tests/docker-retention.bats

      - name: systemd units
        # ExecStart points at the install location, which does not exist on the
        # runner: that one warning is expected, anything else fails the job.
        run: |
          out=$(systemd-analyze verify systemd/docker-retention.timer systemd/docker-retention.service 2>&1 || true)
          unexpected=$(grep -v 'docker-retention.service: Command /usr/local/sbin/docker-retention is not executable' <<<"$out" || true)
          [ -z "$unexpected" ] || { echo "$unexpected"; exit 1; }
