services:
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    restart: unless-stopped
    mem_limit: 256m
    # 3.7.x ships a distroless image with no shell/wget, so an exec-based
    # healthcheck isn't possible here; external uptime checks cover this.

  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - loki

volumes:
  loki-data:

networks:
  monitoring:
    external: true
    name: space-server_monitoring
