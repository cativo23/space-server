global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    webhook_configs:
      - url: http://alertmanager-discord:9094/
        send_resolved: true

inhibit_rules:
  # If a host disk goes critical, suppress the warning-level disk alerts (low
  # space and filling fast) for the same instance and mountpoint. The alerts
  # have different alertnames, so alertname cannot be in `equal`; the names are
  # matched explicitly instead (matching on severity alone would also inhibit
  # unrelated alerts that lack a mountpoint label, since a label missing on
  # both sides counts as equal).
  - source_matchers:
      - alertname = HostDiskSpaceCritical
    target_matchers:
      - alertname =~ "HostDiskSpaceLow|HostDiskFillingFast"
    equal: ['instance', 'mountpoint']
