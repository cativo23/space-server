rule_files:
  - alert_rules.yml

evaluation_interval: 30s

tests:
  # One `docker restart` moves the start time forward by several seconds.
  # That is one restart, not a loop.
  - interval: 30s
    input_series:
      - series: 'container_start_time_seconds{name="app"}'
        values: '1000x10 1007x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: ContainerRestartLoop
        exp_alerts: []

  # Four restarts within fifteen minutes is a loop; the last is at 8m and
  # the rule waits 5m before firing.
  - interval: 30s
    input_series:
      - series: 'container_start_time_seconds{name="app"}'
        values: '1000x4 1120x4 1240x4 1360x4 1480x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: ContainerRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              name: app
            exp_annotations:
              summary: "Container app restarting repeatedly"
              description: "Container app has restarted more than twice in the last 15 minutes."

  # 80 GB disk losing 1 GB an hour from 28 GB free: full in ~28h at that pace,
  # so the 24h projection goes negative and the alert fires after its 1h hold.
  # One-minute samples: a sparser series leaves the instant selector empty
  # past its 5m lookback and keeps resetting the rule's `for`.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node",mountpoint="/",fstype="ext4"}'
        values: '28000000000-16666666x600'
      - series: 'node_filesystem_size_bytes{instance="node",mountpoint="/",fstype="ext4"}'
        values: '80000000000x600'
    alert_rule_test:
      - eval_time: 8h
        alertname: HostDiskFillingFast
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: "Disk on node (/) on course to fill within 24h"
              description: "At the last 6h rate, / runs out of space within a day. Check `docker system df` and container log sizes."

  # The growth measured before the cleanup (~0.4 GB a day at 25 GB free) is
  # the 85% rule's job, not this one's.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node",mountpoint="/",fstype="ext4"}'
        values: '25000000000-277777x600'
      - series: 'node_filesystem_size_bytes{instance="node",mountpoint="/",fstype="ext4"}'
        values: '80000000000x600'
    alert_rule_test:
      - eval_time: 8h
        alertname: HostDiskFillingFast
        exp_alerts: []

  # 5 GB an hour is steep enough to fill the disk within a day, but with 55%
  # still free on a 200 GB disk the 40% guard keeps the alert quiet.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node",mountpoint="/",fstype="ext4"}'
        values: '150000000000-83333333x600'
      - series: 'node_filesystem_size_bytes{instance="node",mountpoint="/",fstype="ext4"}'
        values: '200000000000x600'
    alert_rule_test:
      - eval_time: 8h
        alertname: HostDiskFillingFast
        exp_alerts: []

  # docker-retention writes its last success time and last exit code (node-exporter
  # textfile collector). One skipped day (exit 75) is not a failure and a success
  # 49h ago is still inside the 50h window...
  - interval: 1m
    input_series:
      - series: 'docker_retention_last_success_timestamp_seconds{instance="node"}'
        values: '1000x3200'
      - series: 'docker_retention_last_exit_code{instance="node"}'
        values: '75x3200'
    alert_rule_test:
      - eval_time: 49h
        alertname: DockerRetentionStale
        exp_alerts: []
      - eval_time: 49h
        alertname: DockerRetentionFailed
        exp_alerts: []

  # ...and one older than 50h is stale.
  - interval: 1m
    input_series:
      - series: 'docker_retention_last_success_timestamp_seconds{instance="node"}'
        values: '1000x3200'
    alert_rule_test:
      - eval_time: 51h
        alertname: DockerRetentionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node
            exp_annotations:
              summary: "docker-retention has not succeeded in over 50 hours"
              description: "The last successful image retention run on node was more than 50 hours ago. Check `journalctl -u docker-retention` and `systemctl status docker-retention.timer` on the host."

  # A failed run (exit 1 a removal failed, 70 host state unreadable) alerts at once.
  - interval: 1m
    input_series:
      - series: 'docker_retention_last_exit_code{instance="node"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: DockerRetentionFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node
            exp_annotations:
              summary: "docker-retention failed (exit code 1)"
              description: "The last image retention run on node exited 1 (1 a removal failed, 64 bad configuration, 70 host state unreadable). Check `journalctl -u docker-retention`."

  - interval: 1m
    input_series:
      - series: 'docker_retention_last_exit_code{instance="node"}'
        values: '70x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: DockerRetentionFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node
            exp_annotations:
              summary: "docker-retention failed (exit code 70)"
              description: "The last image retention run on node exited 70 (1 a removal failed, 64 bad configuration, 70 host state unreadable). Check `journalctl -u docker-retention`."

  # No metric at all while node-exporter is up means the job never reported
  # (or the textfile directory is not read); while node-exporter is down
  # PrometheusTargetDown speaks and this stays quiet.
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="node-exporter:9100"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 3h
        alertname: DockerRetentionNeverReported
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "docker-retention has never reported"
              description: "node-exporter is up but exposes no docker_retention metrics. The timer may not have run since the metric was introduced, or the textfile directory is not being read."

  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="node-exporter:9100"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 3h
        alertname: DockerRetentionNeverReported
        exp_alerts: []

  # A file the textfile collector cannot read or parse (permissions, format)
  # is its own alert, so it is not mistaken for a stalled job.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{instance="node"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: NodeTextfileScrapeError
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node
            exp_annotations:
              summary: "node-exporter cannot read a textfile metrics file"
              description: "node_textfile_scrape_error is 1 on node: a .prom file in the textfile directory is unreadable or malformed."
