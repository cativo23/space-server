groups:
  - name: host
    interval: 30s
    rules:
      - alert: HostDiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk >85% on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is at {{ $value | humanizePercentage }}."

      - alert: HostDiskSpaceCritical
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk >95% on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Filesystem {{ $labels.mountpoint }} is at {{ $value | humanizePercentage }}. Imminent failure risk."

      - alert: HostDiskFillingFast
        # Complements the 85%/95% thresholds: catches a burst (a log storm, a
        # run of image pulls) by its slope, a day before the disk is full.
        # The 40% guard keeps a large, mostly empty disk from paging on noise.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.40
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Disk on {{ $labels.instance }} ({{ $labels.mountpoint }}) on course to fill within 24h"
          description: "At the last 6h rate, {{ $labels.mountpoint }} runs out of space within a day. Check `docker system df` and container log sizes."

      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Memory >90% on {{ $labels.instance }}"
          description: "Available memory has been under 10% for 15m. Current usage: {{ $value | humanizePercentage }}."

      - alert: HostLoadHigh
        expr: node_load5 > 2 * count without (cpu, mode) (node_cpu_seconds_total{mode="idle"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Load5 > 2x CPU count on {{ $labels.instance }}"
          description: "5-min load average is {{ $value }} on a host with {{ with query \"count without (cpu, mode) (node_cpu_seconds_total{mode=\\\"idle\\\"})\" }}{{ . | first | value }}{{ end }} CPUs."

  - name: containers
    interval: 30s
    rules:
      - alert: ContainerRestartLoop
        # container_start_time_seconds is a timestamp, not a counter: each
        # restart changes its value once, so changes() counts restarts.
        # increase() would measure how many seconds it moved, which makes a
        # single restart more than 2 seconds later look like a loop.
        expr: changes(container_start_time_seconds[15m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarting repeatedly"
          description: "Container {{ $labels.name }} has restarted more than twice in the last 15 minutes."

      - alert: ContainerDown
        expr: time() - container_last_seen{name!=""} > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} not seen in >5min"
          description: "cAdvisor has not seen container {{ $labels.name }} for over 5 minutes."

  - name: tls
    interval: 60s
    rules:
      - alert: TraefikCertExpiringSoon
        # Traefik never garbage-collects metrics for superseded certs, so old
        # (already-renewed) serials keep reporting their stale not_after
        # forever alongside the current one. max by (cn, sans) picks only the
        # newest cert per hostname so a renewal actually resolves the alert.
        expr: max by (cn, sans) (traefik_tls_certs_not_after) - time() < 14 * 86400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TLS cert for {{ $labels.sans }} expires in <14d"
          description: "Cert SANs={{ $labels.sans }} expires in {{ $value | humanizeDuration }}. Let's Encrypt auto-renews around 30d, so this should self-heal — investigate ACME logs if it doesn't."

  - name: prometheus
    interval: 60s
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target {{ $labels.job }} ({{ $labels.instance }}) down"
          description: "Scrape target has been down for >10 minutes."

  - name: docker-retention
    interval: 60s
    rules:
      # `systemd/docker-retention.service` leaves its last success time and last
      # exit code in node-exporter's textfile directory (scripts/docker-retention.sh).
      # 50h tolerates one skipped day (exit 75, host busy at 04:30).
      - alert: DockerRetentionStale
        expr: time() - docker_retention_last_success_timestamp_seconds > 50 * 3600
        labels:
          severity: warning
        annotations:
          summary: "docker-retention has not succeeded in over 50 hours"
          description: "The last successful image retention run on {{ $labels.instance }} was more than 50 hours ago. Check `journalctl -u docker-retention` and `systemctl status docker-retention.timer` on the host."

      # 75 is a skipped run, not a failure.
      - alert: DockerRetentionFailed
        expr: docker_retention_last_exit_code != 0 and docker_retention_last_exit_code != 75
        labels:
          severity: warning
        annotations:
          summary: "docker-retention failed (exit code {{ $value }})"
          description: "The last image retention run on {{ $labels.instance }} exited {{ $value }} (1 a removal failed, 64 bad configuration, 70 host state unreadable). Check `journalctl -u docker-retention`."

      # Gated on node-exporter being up so a down exporter alerts once, as
      # PrometheusTargetDown, not twice.
      - alert: DockerRetentionNeverReported
        expr: absent(docker_retention_last_success_timestamp_seconds) and on() up{job="node"} == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "docker-retention has never reported"
          description: "node-exporter is up but exposes no docker_retention metrics. The timer may not have run since the metric was introduced, or the textfile directory is not being read."

      - alert: NodeTextfileScrapeError
        expr: node_textfile_scrape_error > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "node-exporter cannot read a textfile metrics file"
          description: "node_textfile_scrape_error is 1 on {{ $labels.instance }}: a .prom file in the textfile directory is unreadable or malformed."
