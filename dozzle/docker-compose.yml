services:
  dozzle:
    image: amir20/dozzle:v11.1.1
    container_name: dozzle
    restart: unless-stopped
    # F30: ceiling sized at >=2x the peak measured on polaris2 (2026-10-20).
    mem_limit: 128m  # peak 30 MiB
    environment:
      - DOCKER_HOST=tcp://dockerproxy:2375
      - DOZZLE_NO_ANALYTICS=1
    healthcheck:
      # The image is distroless (no shell/wget); the binary ships its own probe.
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`dozzle.cativo.dev`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.dozzle.middlewares=internal-only@file,auth@file,security-headers@file"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
    networks:
      - space-server_web

networks:
  space-server_web:
    external: true
