http:
  middlewares:
    # Nightwire-styled pages for the client/server error codes a backend
    # can plausibly return. Backed by deploy/error-pages (nginx serving
    # deploy/error-pages/pages/*.html) — any status without a page falls
    # back to 404.html (see error-pages/nginx.conf).
    custom-errors:
      errors:
        status:
          - "400-401"
          - "403-405"
          - "408-410"
          - "413-415"
          - "422"
          - "429"
          - "431"
          - "500-505"
        service: error-pages-svc
        query: "/{status}.html"

  services:
    error-pages-svc:
      loadBalancer:
        servers:
          - url: "http://error-pages:80"
