http:
  routers:
    # Catch-all fallback for any Host with no matching router — services
    # stopped on purpose (freeing resources: hellokitty, umami, ...) as
    # well as any genuinely unknown/mistyped subdomain. The Docker
    # provider only creates a router while its container is up, so with
    # it down, nothing else here matches at all and Traefik would
    # otherwise show its own plain-text 404 (errors@file never gets a
    # chance — it hangs off the now-absent docker-provider router).
    #
    # Priority 1 keeps this last in line: a docker-provider Host() rule's
    # computed priority (proportional to rule length) is always higher,
    # so the moment a real container comes back up its router wins again
    # automatically — nothing to update here when pausing/unpausing.
    #
    # No certresolver on purpose: TLS termination for a Host that already
    # has a cert (issued while its real router was active) still uses
    # that cached cert via SNI regardless of which router ends up serving
    # the request. Adding a certresolver here would make Traefik attempt
    # ACME issuance for literally any Host header a client sends — a
    # cert-issuance/rate-limit abuse vector we don't want on a catch-all.
    paused-fallback:
      rule: "HostRegexp(`^.+$`)"
      entrypoints:
        - websecure
      service: error-pages-svc
      priority: 1
      tls: {}
