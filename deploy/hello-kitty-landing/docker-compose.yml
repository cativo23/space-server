name: hello-kitty-landing

services:
  app:
    image: cativo23/hello-kitty-landing:latest
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hellokitty.rule=Host(`devi.cativo.dev`)"
      - "traefik.http.routers.hellokitty.entrypoints=websecure"
      - "traefik.http.routers.hellokitty.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.hellokitty.loadbalancer.server.port=80"
      - "traefik.docker.network=space-server_web"
    networks:
      - space-server_web

networks:
  space-server_web:
    external: true
