name: error-pages

# Static Nightwire-styled error pages, used two ways:
#  1. Traefik's errors@file middleware (traefik/dynamic/errors.yml) queries
#     /{status}.html directly on an up-but-failing container's router.
#  2. traefik/dynamic/paused-services.yml routes a Host straight here (503)
#     when the real container is stopped on purpose (no docker router exists
#     to hang the errors middleware off of).
# Not routed via Host() itself — only reachable from Traefik, by container
# name, over space-server_web.

services:
  app:
    # nginx 1.27 went EOL 2025-06-24 (last build 1.27.5, 2025-04-16). 1.30 is the current
    # stable line (even minors are stable). Digest verified 2026-10-20; `nginx -t` passed
    # against this stack's nginx.conf before the change.
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    container_name: error-pages
    restart: unless-stopped
    # F30: ceiling sized at >=2x the peak measured on polaris2 (2026-10-20).
    mem_limit: 64m  # peak 16 MiB
    volumes:
      - ./pages:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/404.html"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - space-server_web

networks:
  space-server_web:
    external: true
