server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Direct hits (from the errors@file middleware querying /{status}.html
    # against an up container's failure) are served plainly.
    location = /404.html { }
    location = /502.html { }
    location = /503.html { }
    location = /504.html { }

    # Anything else — i.e. this container being hit directly as the
    # fallback router's backend for a paused service — answers 503 with
    # the styled page, status code included.
    error_page 503 /503.html;
    location / {
        return 503;
    }
}
