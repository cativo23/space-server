server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Direct hits (from the errors@file middleware querying /{status}.html
    # against an up container's failure) are served plainly. Falls back to
    # 404.html if a status code has no matching page.
    location ~ "^/[0-9]{3}\.html$" {
        try_files $uri /404.html;
    }

    # Anything else — i.e. this container being hit directly as the
    # fallback router's backend for a paused service — mirrors what
    # Traefik itself would say with no router matched: a plain 404,
    # just styled instead of raw text.
    error_page 404 /404.html;
    location / {
        return 404;
    }
}
