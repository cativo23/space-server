name: ghost-blog-prod
services:
  ghost:
    # F15: exact version + digest verified identical to what ran on 2026-10-20. Ghost 5 is EOL
    # (Jan 2026); the move to Ghost 6 is a separate, rehearsed change.
    image: ghost:5.130.6-alpine@sha256:a0506f3f05f5bdc6c950c5113cdcdb1e1f96fbf15f6dc0a39fc093c25348bdb5
    restart: unless-stopped
    # F30: ceiling sized at >=2x the peak measured on polaris2 (2026-10-20).
    mem_limit: 512m  # peak 173 MiB
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ${DB_PASSWORD}
      database__connection__database: ghost
      url: https://blog.cativo.dev
      mail__transport: SMTP
      mail__options__host: ${SMTP_HOST}
      mail__options__port: ${SMTP_PORT}
      mail__options__auth__user: ${SMTP_USER}
      mail__options__auth__pass: ${SMTP_PASS}
      mail__from: noreply@cativo.dev
      imageOptimization__resize: false
      NODE_ENV: production
    volumes:
      - ghost-content:/var/lib/ghost/content
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Ghost redirects plain-HTTP requests to its https `url`, which would make
      # a naive probe fail; the forwarded-proto header makes it answer directly.
      test: ["CMD", "wget", "-q", "--spider", "--header=X-Forwarded-Proto: https", "http://127.0.0.1:2368/ghost/api/admin/site/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ghost-blog.rule=Host(`blog.cativo.dev`)"
      - "traefik.http.routers.ghost-blog.entrypoints=websecure"
      - "traefik.http.routers.ghost-blog.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.ghost-blog.middlewares=custom-errors@file"
      - "traefik.http.services.ghost-blog.loadbalancer.server.port=2368"
      - "traefik.docker.network=space-server_web"
    networks:
      - ghost-internal
      - space-server_web

  db:
    # F15: pinned to 8.0.46 (digest verified 2026-10-20). MySQL 8.0 is EOL (2026-04-30); 8.4 LTS
    # is a separate, rehearsed change (the auth-plugin flag below is removed in 8.4).
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    # F30: ceiling sized at >=2x the peak measured on polaris2 (2026-10-20).
    # Generous on purpose: an OOM kill here means InnoDB crash recovery.
    mem_limit: 1g  # peak 492 MiB
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 3s
    networks:
      - ghost-internal

volumes:
  ghost-content:
  db-data:

networks:
  ghost-internal:
  space-server_web:
    external: true
