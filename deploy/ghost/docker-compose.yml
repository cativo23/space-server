name: ghost-blog-prod
services:
  ghost:
    # Ghost 6 (Ghost 5 went EOL in Jan 2026). The digest rehearsed is the digest deployed.
    # Rollback target: tag ghost-pre-b (Ghost 5.130.6 + MySQL 8.0.46 on the old volumes).
    image: ghost:6.72.0-alpine@sha256:5dcbc3d1d27206db4f5fc2099524b0b447cf986f2f64d1f95b045200e2ca1f65
    restart: unless-stopped
    # F30: ceiling sized at >=2x the peak measured on polaris2 (2026-10-20).
    mem_limit: 512m  # peak 173 MiB
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ${DB_PASSWORD}
      database__connection__database: ghost
      url: https://blog.cativo.dev
      mail__transport: SMTP
      mail__options__host: ${SMTP_HOST}
      mail__options__port: ${SMTP_PORT}
      mail__options__auth__user: ${SMTP_USER}
      mail__options__auth__pass: ${SMTP_PASS}
      mail__from: noreply@cativo.dev
      imageOptimization__resize: false
      NODE_ENV: production
    volumes:
      # New volume on purpose: the old `ghost-content` stays untouched for rollback, and is
      # deliberately NOT declared below so `down -v` from this file can never delete it.
      - ghost-content-v6:/var/lib/ghost/content
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Ghost redirects plain-HTTP requests to its https `url`, which would make
      # a naive probe fail; the forwarded-proto header makes it answer directly.
      test: ["CMD", "wget", "-q", "--spider", "--header=X-Forwarded-Proto: https", "http://127.0.0.1:2368/ghost/api/admin/site/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ghost-blog.rule=Host(`blog.cativo.dev`)"
      - "traefik.http.routers.ghost-blog.entrypoints=websecure"
      - "traefik.http.routers.ghost-blog.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.ghost-blog.middlewares=custom-errors@file"
      - "traefik.http.services.ghost-blog.loadbalancer.server.port=2368"
      - "traefik.docker.network=space-server_web"
    networks:
      - ghost-internal
      - space-server_web

  db:
    # MySQL 8.4 LTS (8.0 went EOL 2026-04-30). The official image tops out at 8.4.11 today
    # (8.4.13 exists upstream but not on Docker Hub). Digest rehearsed == digest deployed.
    image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    restart: unless-stopped
    # Collation: Ghost 6 creates tables with `default character set utf8mb4`, which MySQL resolves to
    # utf8mb4_0900_ai_ci and cannot FK to the utf8mb4_general_ci tables a Ghost 5 database has (errno 3780).
    # The cutover therefore converts the restored database to 0900_ai_ci before Ghost 6 starts.
    # F30: ceiling sized at >=2x the peak measured on polaris2 (2026-10-20).
    # Generous on purpose: an OOM kill here means InnoDB crash recovery.
    mem_limit: 1g  # peak 492 MiB
    # `--default-authentication-plugin` is gone in 8.4 (mysqld would refuse to start). The ghost
    # user is created by the entrypoint with caching_sha2_password, which mysql2 handles.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      # New volume on purpose (old `db-data` untouched for rollback, not declared below).
      - db-data-84:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP), not localhost (socket): the entrypoint's temporary init server answers
      # on the socket, which would report healthy before 3306 is open.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      timeout: 5s
      retries: 10
      interval: 3s
    networks:
      - ghost-internal

volumes:
  ghost-content-v6:
  db-data-84:

networks:
  ghost-internal:
  space-server_web:
    external: true
